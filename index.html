<!doctype html>
<html lang="en" data-page="about">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Personal resume, projects, and writing.">
    <title>Your Name</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (_) { document.documentElement.dataset.theme = "light"; }
    </script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand text-link js-name" href="index.html">Your Name</a>
        <nav aria-label="Primary navigation">
          <a class="text-link active" href="index.html">about</a>
          <a class="text-link" href="projects.html">projects</a>
          <a class="text-link" href="writing.html">writing</a>
          <a class="text-link" href="design.html">design</a>
        </nav>
        <button class="icon-button js-theme" aria-label="Toggle color theme"></button>
        <button class="shortcut js-palette-open" aria-label="Open command menu"><kbd>ctrl</kbd><span>+</span><kbd>K</kbd></button>
      </header>

      <main>
        <section class="intro" aria-label="Resume overview">
          <p class="diamond-line"><span>◆</span><span id="role-line"></span></p>
          <p class="diamond-line"><span>◆</span><span id="education-line"></span></p>
          <h2>◆ <em>what i’ve been building:</em></h2>
          <ul class="branch-list" id="highlights"></ul>
          <h2>◆ <em>previously:</em></h2>
          <ul class="branch-list experience-list" id="experience"></ul>
        </section>
        <a class="work-cta" href="projects.html">see what i’ve built <span aria-hidden="true">▯</span></a>
        <div class="signature" aria-label="Personal signature">
          <img src="assets/signature-line-light.png" alt="">
        </div>
      </main>

      <footer id="site-footer"></footer>
    </div>
    <div id="command-palette"></div>
    <script src="site-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
